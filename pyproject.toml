[project]
name = "yolov8-tumor-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soufyane El Omrani", email = "elomranisoufyan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "kagglehub>=1.0.3",
    "mlflow>=3.17.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "pathlib>=1.0.1",
    "python-multipart>=0.0.34",
    "seaborn>=0.13.2",
    "supervision>=0.31.2",
    "tqdm>=4.70.1",
    "ultralytics>=8.4.189",
    "ultralytics-platform>=0.1.94",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
yolov8-tumor-detection = "yolov8_tumor_detection:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yolov8_tumor_detection"
module-root = "src"
