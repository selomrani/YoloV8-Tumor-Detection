[project]
name = "yolov8-tumor-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soufyane El Omrani", email = "elomranisoufyan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "kagglehub>=1.0.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "seaborn>=0.13.2",
    "supervision>=0.31.2",
    "ultralytics>=8.4.189",
]

[project.scripts]
yolov8-tumor-detection = "yolov8_tumor_detection:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
